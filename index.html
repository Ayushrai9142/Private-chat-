<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modern Chat Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">

    <!-- Login Screen -->
    <form class="login-form" id="login-screen">
      <h2>Welcome Back</h2>
      <p>Login to continue chatting</p>

      <div class="input-box">
        <input type="email" id="email" required />
        <label for="email">Email</label>
      </div>

      <div class="input-box">
        <input type="password" id="password" required />
        <label for="password">Password</label>
      </div>

      <button type="button" onclick="login()">Login</button>

      <p class="divider">or</p>

      <button type="button" class="signup-btn" onclick="signup()">Sign Up</button>
    </form>

    <!-- Chat Screen -->
    <div class="chat-screen" id="chat-screen" style="display: none;">
      <div class="chat-header">Chat App</div>
      <div class="chat-box" id="chat-box"></div>
      <div class="chat-input">
        <input type="text" id="message-input" placeholder="Type a message..." />
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>

  </div>

  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
  <script src="script.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js')
        .then(() => console.log('Service Worker Registered'));
    }
  </script>
</body>
</html>
