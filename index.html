<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Private Chat</title>
<link rel="manifest" href="manifest.json">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; }
  body, html { height: 100%; background: #e5ddd5; display: flex; justify-content: center; align-items: center; padding: 0; }
  
  /* Container Setup */
  .container { width: 100%; height: 100%; max-width: 600px; background: #fff; display: flex; flex-direction: column; position: relative; }
  
  /* Login Screen */
  #login-container { padding: 40px; justify-content: center; align-items: center; text-align: center; background: rgba(255,255,255,0.9); height: 100%; position: absolute; z-index: 10; width: 100%; }
  h2 { color: #075e54; margin-bottom: 20px; }
  input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; }
  button { width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; }
  .btn-green { background: #25d366; color: white; }
  .btn-green:hover { background: #128c7e; }
  .btn-outline { background: transparent; border: 1px solid #075e54; color: #075e54; }

  /* Chat Screen */
  #chat-screen { display: none; flex-direction: column; height: 100%; width: 100%; }
  
  /* Header */
  .chat-header { background: #075e54; color: white; padding: 15px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
  .header-title { font-weight: bold; font-size: 18px; }
  .header-actions button { background: transparent; color: white; border: 1px solid white; padding: 5px 10px; font-size: 12px; border-radius: 4px; margin-left: 5px; }

  /* Chat Box */
  .chat-box { flex-grow: 1; padding: 15px; background: #e5ddd5; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }

  /* Input Area */
  .chat-input-area { background: #f0f0f0; padding: 10px; display: flex; align-items: center; border-top: 1px solid #ddd; }
  .chat-input-area input[type="text"] { flex-grow: 1; padding: 10px; border-radius: 20px; border: none; outline: none; margin: 0 10px; }
  .icon-btn { background: none; border: none; font-size: 20px; cursor: pointer; padding: 5px; margin: 0; color: #555; width: auto; }
  
  /* Messages */
  .message { max-width: 75%; padding: 8px 12px; border-radius: 8px; position: relative; word-wrap: break-word; font-size: 14px; }
  .my-message { background: #dcf8c6; align-self: flex-end; border-radius: 8px 0 8px 8px; }
  .other-message { background: #fff; align-self: flex-start; border-radius: 0 8px 8px 8px; }
  
  .sender-name { font-size: 10px; font-weight: bold; color: #e55e5e; margin-bottom: 2px; }
  .msg-time { font-size: 9px; color: #999; text-align: right; margin-top: 4px; }
  .msg-img { max-width: 100%; border-radius: 5px; margin-top: 5px; display: block; }
  
  /* Delete Button */
  .delete-btn { font-size: 10px; color: red; cursor: pointer; margin-left: 5px; font-weight: bold; border: 1px solid red; padding: 0 4px; border-radius: 4px; display: inline-block; }

</style>
</head>
<body>

<div class="container">

  <div id="login-container" style="display: flex;">
    <h2>🔐 Private Chat</h2>
    <input type="email" id="email" placeholder="Email Address" />
    <input type="password" id="password" placeholder="Password" />
    <button id="login-btn" class="btn-green">Login</button>
    <button id="signup-btn" class="btn-outline">Create Account</button>
  </div>

  <div id="chat-screen">
    <div class="chat-header">
      <div class="header-title">Chat Room</div>
      <div class="header-actions">
        <button id="profile-btn">👤 Name</button>
        <button id="logout-btn" style="background:#ff4444; border:none;">Logout</button>
      </div>
    </div>

    <div class="chat-box" id="chat-box"></div>

    <div class="chat-input-area">
      <button class="icon-btn" id="upload-trigger">📷</button>
      <input type="file" id="image-input" accept="image/*" hidden>
      
      <input type="text" id="message-input" placeholder="Type a message..." />
      <button class="icon-btn" id="send-msg-btn" style="color: #075e54;">➤</button>
    </div>
  </div>

</div>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js');
  }
</script>

<script type="module" src="script.js"></script>

</body>
</html>
