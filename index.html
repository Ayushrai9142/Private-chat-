<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Private Chat</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container" id="login-container">
  <h2>Welcome Back</h2>
  <div class="input-group"><input type="email" id="email" placeholder="Email" /></div>
  <div class="input-group"><input type="password" id="password" placeholder="Password" /></div>
  <button id="login-btn">Login</button>
  <div style="margin:10px 0;">or</div>
  <button id="signup-btn" class="signup-btn">Sign Up</button>
  <div id="auth-error-msg"></div>
</div>

<div id="users-screen">
  <div class="users-header">
    <span>Contacts</span>
    <div class="header-btns">
      <button id="add-friend-btn" class="small-btn" style="background:#fff; color:#075e54; font-weight:bold;">➕ Add</button>
      <button id="profile-btn" class="small-btn">👤 Profile</button>
      <button id="logout-btn" class="small-btn" style="background:#ff4444;">Logout</button>
    </div>
  </div>
  <div class="users-list" id="users-list">
    <div style="text-align:center; padding:20px; color:#888;">Loading...</div>
  </div>
</div>

<div id="chat-screen">
  <div class="chat-header">
    <div style="display:flex; align-items:center;">
      <button id="back-btn" class="back-btn">←</button>
      <span id="chat-user-name">Chat</span>
    </div>
  </div>
  
  <div class="chat-box" id="chat-box"></div>
  
  <div class="chat-input-area">
    <button class="icon-btn" id="upload-trigger">📷</button>
    <input type="file" id="image-input" accept="image/*" hidden>
    <input type="text" id="message-input" placeholder="Type a message..." />
    <button class="icon-btn" id="send-msg-btn" style="color:#075e54;">➤</button>
  </div>
</div>

<div id="custom-modal">
  <div class="modal-content">
    <h3 id="modal-title">Title</h3>
    
    <div id="profile-section" style="display:none;">
      <p style="font-size:12px; color:#666;">Share this ID with friends:</p>
      <div class="uid-box" id="my-uid-text">...</div>
      <button id="copy-uid-btn" class="copy-btn">Copy ID</button>
      <hr style="margin:15px 0; border:0; border-top:1px solid #eee;">
    </div>

    <div id="requests-section" style="display:none; text-align:left; margin-top:10px;">
       <h4 style="font-size:14px; color:#075e54; border-bottom:1px solid #ddd; padding-bottom:5px; margin-bottom:10px;">Friend Requests:</h4>
       <div id="requests-list"></div>
    </div>

    <input type="text" id="modal-input">
    
    <div style="margin-top:15px;">
      <button id="modal-cancel" class="modal-btn" style="background:#ff4444; color:white;">Close</button>
      <button id="modal-confirm" class="modal-btn" style="background:#25d366; color:white;">OK</button>
    </div>
  </div>
</div>
<div id="toast-box">Notification</div>

<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js');
</script>
<script type="module" src="script.js"></script>

</body>
</html>
