
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Private Chat</title>
<link rel="manifest" href="manifest.json">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  
  body, html {
    height: 100%; width: 100%;
    background: #e5ddd5;
    display: flex; justify-content: center; align-items: center;
    overflow: hidden;
  }

  /* --- MAIN CONTAINER --- */
  .container {
    width: 100%; height: 100%; max-width: 500px;
    position: relative;
    /* Container transparent rahega taaki login box ka glass effect dikhe */
  }

  /* --- LOGIN SCREEN (GLASS DESIGN + CENTERED) --- */
  #login-container {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%); /* Perfect Center */
    width: 90%; max-width: 400px;
    height: auto; /* No Stretch */
    
    /* YEH HAI PURANA WALA GLASS DESIGN 👇 */
    background: rgba(255, 255, 255, 0.4); 
    backdrop-filter: blur(12px); 
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.5);
    
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    display: flex; flex-direction: column; justify-content: center;
    z-index: 100;
  }

  h2 { color: #075e54; margin-bottom: 25px; text-align: center; font-weight: bold; }

  input.auth-input {
    width: 100%; padding: 12px; margin-bottom: 12px;
    border: 1px solid rgba(255,255,255,0.6); /* Semi transparent border */
    border-radius: 8px;
    outline: none; font-size: 16px; 
    background: rgba(255,255,255,0.8); /* Thoda transparent input */
  }

  .btn-main {
    width: 100%; background: #25d366; color: white; border: none;
    padding: 12px; border-radius: 8px; font-weight: bold; font-size: 16px;
    cursor: pointer; margin-top: 5px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  }
  .btn-sec { background: transparent; color: #075e54; border: 1px solid #075e54; margin-top: 10px; box-shadow: none; }

  /* ERROR MSG */
  #auth-error-msg {
    color: #d32f2f; font-size: 13px; margin-top: 15px;
    text-align: center; display: none;
    background: rgba(255, 235, 238, 0.9); padding: 8px; border-radius: 5px;
  }

  /* --- CHAT SCREEN --- */
  #chat-screen {
    display: none; flex-direction: column;
    height: 100%; width: 100%; z-index: 50;
    background: #fff;
    box-shadow: 0 0 20px rgba(0,0,0,0.1); /* Chat screen pe shadow wapas laye */
  }

  .chat-header {
    background: #075e54; color: white; padding: 15px;
    display: flex; justify-content: space-between; align-items: center;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1); flex-shrink: 0;
  }
  .header-actions button {
    background: rgba(255,255,255,0.2); border: none; color: white;
    padding: 6px 12px; border-radius: 4px; font-size: 12px;
    margin-left: 8px; cursor: pointer;
  }

  .chat-box {
    flex-grow: 1; background: #e5ddd5; padding: 15px;
    overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
  }

  .message {
    max-width: 80%; padding: 6px 10px; border-radius: 8px;
    font-size: 15px; position: relative; word-wrap: break-word;
    box-shadow: 0 1px 1px rgba(0,0,0,0.1);
  }
  .my-message { align-self: flex-end; background: #dcf8c6; cursor: pointer; }
  .other-message { align-self: flex-start; background: #fff; }
  
  .sender-name { font-size: 11px; font-weight: bold; color: #e55e5e; margin-bottom: 2px; display: block; }
  .msg-img { max-width: 100%; border-radius: 6px; margin-top: 5px; display: block; }
  .msg-time { font-size: 10px; color: #777; display: block; text-align: right; margin-top: 3px; }

  .chat-input-area {
    padding: 10px; background: #f0f0f0; display: flex; align-items: center;
    border-top: 1px solid #ddd; flex-shrink: 0;
  }
  .chat-input-area input {
    flex-grow: 1; padding: 12px; border-radius: 20px;
    border: none; outline: none; margin: 0 8px; font-size: 15px;
  }
  .icon-btn { border: none; background: none; font-size: 24px; cursor: pointer; padding: 0 5px; color: #555; }

  /* --- MODAL --- */
  #custom-modal {
    display: none; position: absolute; top: 0; left: 0;
    width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 200;
    justify-content: center; align-items: center;
  }
  .modal-content {
    background: white; padding: 25px; border-radius: 12px;
    width: 80%; max-width: 300px; text-align: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  }
  .modal-btn { padding: 8px 20px; border-radius: 5px; border: none; cursor: pointer; font-weight: bold; margin: 10px 5px 0 5px; font-size: 14px; }
  .btn-confirm { background: #25d366; color: white; }
  .btn-cancel { background: #ff4444; color: white; }
  #modal-input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; margin-top: 15px; display: none; }

  /* --- TOAST --- */
  #toast-box {
    visibility: hidden; min-width: 250px; background-color: #333; color: #fff;
    text-align: center; border-radius: 4px; padding: 12px;
    position: fixed; z-index: 300; left: 50%; bottom: 30px;
    transform: translateX(-50%); font-size: 14px;
  }
  #toast-box.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
  @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
  @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
</style>
</head>
<body>

<div class="container">

  <div id="login-container">
    <h2>Private Chat</h2>
    <input type="email" id="email" class="auth-input" placeholder="Email Address" />
    <input type="password" id="password" class="auth-input" placeholder="Password" />
    <button id="login-btn" class="btn-main">Login</button>
    <button id="signup-btn" class="btn-main btn-sec">Sign Up</button>
    <div id="auth-error-msg"></div>
  </div>

  <div id="chat-screen">
    <div class="chat-header">
      <span style="font-weight: bold;">Chat Room</span>
      <div class="header-actions">
        <button id="profile-btn">👤 Profile</button>
        <button id="logout-btn" style="background:#ff4444;">Logout</button>
      </div>
    </div>
    
    <div class="chat-box" id="chat-box"></div>

    <div class="chat-input-area">
      <button class="icon-btn" id="upload-trigger">📷</button>
      <input type="file" id="image-input" accept="image/*" hidden>
      <input type="text" id="message-input" placeholder="Message..." />
      <button class="icon-btn" id="send-msg-btn" style="color:#075e54;">➤</button>
    </div>
  </div>

  <div id="custom-modal">
    <div class="modal-content">
      <h3 id="modal-title" style="color:#333; font-size: 18px;">Title</h3>
      <input type="text" id="modal-input" placeholder="Enter name">
      <div>
        <button id="modal-cancel" class="modal-btn btn-cancel">Cancel</button>
        <button id="modal-confirm" class="modal-btn btn-confirm">OK</button>
      </div>
    </div>
  </div>

  <div id="toast-box">Notification</div>

</div>

<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js');
</script>
<script type="module" src="script.js"></script>

</body>
</html>
