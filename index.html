<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Private Chat</title>
<link rel="manifest" href="manifest.json">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  
  body, html {
    height: 100%;
    background: #e5ddd5;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden; /* Scroll band */
  }

  /* --- COMPACT CONTAINER (Fixed Size Issue) --- */
  .container {
    width: 90%;
    max-width: 450px; /* Mobile width fix */
    background: rgba(255,255,255,0.6); /* Glassy */
    backdrop-filter: blur(12px);
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    height: auto; /* Height fix - Jitna content utni height */
    max-height: 90vh; /* Screen se bahar na jaye */
    position: relative;
  }

  /* --- LOGIN SECTION --- */
  #login-container {
    padding: 40px 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
  }

  h2 { color: #075e54; margin-bottom: 25px; font-weight: 700; }

  input.auth-input {
    width: 100%; padding: 12px 15px; margin-bottom: 15px;
    border: 1px solid #ddd; border-radius: 10px;
    outline: none; background: #fff; font-size: 16px;
  }

  .btn-main {
    width: 100%; background: #25d366; color: white; border: none;
    padding: 12px; border-radius: 10px; font-weight: bold; font-size: 16px;
    cursor: pointer; margin-bottom: 10px;
  }
  .btn-sec { background: transparent; color: #075e54; border: 1px solid #075e54; }

  /* --- CHAT SECTION --- */
  #chat-screen {
    display: none;
    flex-direction: column;
    height: 80vh; /* Chat ki height fix */
    width: 100%;
    background: #fff;
  }

  .chat-header {
    background: #075e54; color: white; padding: 15px;
    display: flex; justify-content: space-between; align-items: center;
    flex-shrink: 0;
  }
  
  .header-actions button {
    background: rgba(255,255,255,0.2); border: none; color: white;
    padding: 6px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; margin-left: 5px;
  }

  .chat-box {
    flex-grow: 1; background: #e5ddd5; padding: 15px;
    overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
  }

  .message {
    max-width: 80%; padding: 8px 12px; border-radius: 8px;
    font-size: 14px; position: relative; word-wrap: break-word;
    box-shadow: 0 1px 2px rgba(0,0,0,0.1);
  }
  .my-message { align-self: flex-end; background: #dcf8c6; border-radius: 8px 0 8px 8px; }
  .other-message { align-self: flex-start; background: #fff; border-radius: 0 8px 8px 8px; }

  .sender-name { font-size: 11px; font-weight: bold; color: #d9534f; margin-bottom: 2px; }
  .msg-img { max-width: 100%; border-radius: 6px; margin-top: 5px; }
  .delete-btn { position: absolute; top: -8px; right: -8px; background: red; color: white; border-radius: 50%; width: 18px; height: 18px; font-size: 10px; text-align: center; line-height: 18px; cursor: pointer; display: none; }
  
  /* Show delete button on click/hover logic handled in JS */

  .chat-input-area {
    padding: 10px; background: #f0f0f0; display: flex; align-items: center; border-top: 1px solid #ddd;
  }
  .chat-input-area input { flex-grow: 1; padding: 10px; border-radius: 20px; border: none; outline: none; margin: 0 10px; }
  .icon-btn { border: none; background: none; font-size: 22px; cursor: pointer; padding: 0 5px; }

  /* --- CUSTOM MODAL (No Alert Box) --- */
  #custom-modal {
    display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.5); z-index: 200;
    justify-content: center; align-items: center;
  }
  .modal-content {
    background: white; padding: 20px; border-radius: 15px; width: 85%; text-align: center;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
  }
  .modal-btn { padding: 8px 20px; border-radius: 5px; border: none; cursor: pointer; font-weight: bold; margin: 5px; }
  .btn-confirm { background: #25d366; color: white; }
  .btn-cancel { background: #ff4444; color: white; }
  #modal-input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; margin: 10px 0; display: none; }

</style>
</head>
<body>

<div class="container">

  <div id="login-container">
    <h2>Private Chat</h2>
    <input type="email" id="email" class="auth-input" placeholder="Email" />
    <input type="password" id="password" class="auth-input" placeholder="Password" />
    <button id="login-btn" class="btn-main">Login</button>
    <button id="signup-btn" class="btn-main btn-sec">Sign Up</button>
  </div>

  <div id="chat-screen">
    <div class="chat-header">
      <span id="header-title">Chat Room</span>
      <div class="header-actions">
        <button id="profile-btn">👤 Name</button>
        <button id="logout-btn" style="background:#d32f2f;">Logout</button>
      </div>
    </div>
    
    <div class="chat-box" id="chat-box"></div>

    <div class="chat-input-area">
      <button class="icon-btn" id="upload-trigger">📷</button>
      <input type="file" id="image-input" accept="image/*" hidden>
      <input type="text" id="message-input" placeholder="Message..." />
      <button class="icon-btn" id="send-msg-btn" style="color:#075e54;">➤</button>
    </div>
  </div>

  <div id="custom-modal">
    <div class="modal-content">
      <h3 id="modal-title" style="margin-bottom: 10px; color:#333;">Title</h3>
      <input type="text" id="modal-input" placeholder="Enter new name">
      <div style="margin-top: 15px;">
        <button id="modal-cancel" class="modal-btn btn-cancel">Cancel</button>
        <button id="modal-confirm" class="modal-btn btn-confirm">OK</button>
      </div>
    </div>
  </div>

</div>

<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js');
</script>
<script type="module" src="script.js"></script>

</body>
</html>
