<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Private Chat</title>
<style>
  /* CSS wahi purana wala same rahega, bas yahan paste kar raha hu formatting ke liye */
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; }
  body, html { height: 100%; background: #e5ddd5; display: flex; justify-content: center; align-items: center; padding: 20px; }
  .container { width: 100%; max-width: 600px; background: rgba(255,255,255,0.9); border-radius: 24px; padding: 36px 30px; box-shadow: 0 8px 40px rgba(7,94,84,0.14); text-align: center; color: #075e54; }
  h2 { font-size: 2em; margin-bottom: 10px; }
  .input-group { margin-bottom: 20px; text-align: left; }
  .input-group input { width: 100%; padding: 14px; border-radius: 8px; border: 1px solid #ccc; outline: none; }
  button { width: 100%; background: #25d366; border: none; padding: 15px; border-radius: 8px; color: #fff; cursor: pointer; margin-bottom: 12px; font-weight: bold; }
  button:hover { background: #128c7e; }
  .signup-btn { background: #075e54; }
  
  /* Screens logic */
  #chat-screen { display: none; background: #fff; border-radius: 14px; width: 100%; max-width: 700px; height: 600px; flex-direction: column; }
  .chat-header { background: #075e54; color: white; padding: 14px; border-radius: 14px 14px 0 0; }
  .chat-box { flex-grow: 1; padding: 16px; background: #e5ddd5; overflow-y: auto; display: flex; flex-direction: column; }
  .chat-input { display: flex; padding: 10px; background: #f0f0f0; border-radius: 0 0 14px 14px; }
  .chat-input input { flex-grow: 1; padding: 10px; border-radius: 20px; border: none; outline: none; }
  .chat-input button { width: auto; margin-left: 10px; padding: 10px 20px; margin-bottom: 0; }

  /* Messages */
  .message { padding: 8px 12px; border-radius: 8px; margin: 5px 0; max-width: 70%; word-wrap: break-word; }
  .my-message { background: #dcf8c6; align-self: flex-end; text-align: right; margin-left: auto; }
  .other-message { background: #fff; align-self: flex-start; text-align: left; margin-right: auto; }
</style>
</head>
<body>

<div class="container" id="login-container">
  <div id="login-screen">
    <h2>Welcome Back</h2>
    <div class="input-group"><input type="email" id="email" placeholder="Email" /></div>
    <div class="input-group"><input type="password" id="password" placeholder="Password" /></div>
    <button id="login-btn">Login</button>
    <div style="margin:10px 0;">or</div>
    <button id="signup-btn" class="signup-btn">Sign Up</button>
  </div>
</div>

<div id="chat-screen">
  <div class="chat-header">
  <span>Private Room</span>
  <button id="logout-btn" style="background:red; padding:5px 10px; font-size:12px; margin-left:auto;">Logout</button>
  </div>
  
  <div class="chat-box" id="chat-box"></div>
  <div class="chat-input">
    <input type="text" id="message-input" placeholder="Type a message..." />
    <button id="send-msg-btn">Send</button>
  </div>
</div>

<script type="module" src="script.js"></script>

</body>
</html>
